name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PORT: ${{ secrets.PORT }}
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DATABASE_URL,SESSION_SECRET,PORT,OPENOBSERVE_URL,OPENOBSERVE_USER,OPENOBSERVE_PASSWORD
          script: |
            set -euo pipefail
            APP_DIR="$HOME/temp-battle"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --depth=1 https://github.com/fireweave-HQ-Demo/temp-battle.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --depth=1 origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            cat > .env <<EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=${DATABASE_URL}
            SESSION_SECRET=${SESSION_SECRET}
            PORT=${PORT}
            OPENOBSERVE_URL=${OPENOBSERVE_URL}
            OPENOBSERVE_USER=${OPENOBSERVE_USER}
            OPENOBSERVE_PASSWORD=${OPENOBSERVE_PASSWORD}
            EOF

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER" || true
            fi

            sudo docker compose up -d --build --remove-orphans
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT:-3000}/api/health" >/dev/null 2>&1; then
                echo "healthy"
                exit 0
              fi
              sleep 1
            done
            echo "health check failed"
            sudo docker compose logs --tail=80
            exit 1
