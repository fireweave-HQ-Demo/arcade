name: Deploy to EC2

on:
  push:
    branches: [main, fw-base]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy prod
        uses: appleboy/ssh-action@v1.2.2
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL }}
          OPENOBSERVE_USER: ${{ secrets.OPENOBSERVE_USER }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          OPENOBSERVE_LOG_STREAM: ${{ secrets.OPENOBSERVE_LOG_STREAM }}
          OPENOBSERVE_TRACE_STREAM: ${{ secrets.OPENOBSERVE_TRACE_STREAM }}
          FW_API_URL: ${{ secrets.FW_API_URL }}
          FW_PROJECT_API_KEY: ${{ secrets.FW_PROJECT_API_KEY }}
          PUBLIC_FW_API_URL: ${{ secrets.FW_API_URL }}
          PUBLIC_FW_PROJECT_API_KEY: ${{ secrets.PUBLIC_FW_PROJECT_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 20s
          command_timeout: 2m
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DATABASE_URL,SESSION_SECRET,OPENOBSERVE_URL,OPENOBSERVE_USER,OPENOBSERVE_PASSWORD,OPENOBSERVE_LOG_STREAM,OPENOBSERVE_TRACE_STREAM,FW_API_URL,FW_PROJECT_API_KEY,PUBLIC_FW_API_URL,PUBLIC_FW_PROJECT_API_KEY
          script: |
            set -euo pipefail
            # Branch that triggered this workflow (main or fw-base) — must match prod checkout.
            BRANCH="${{ github.ref_name }}"
            case "$BRANCH" in
              main|fw-base) ;;
              *) echo "refusing to deploy unexpected branch: $BRANCH" >&2; exit 1 ;;
            esac
            APP_DIR="$HOME/arcade"
            if [ ! -d "$APP_DIR/.git" ]; then
              # migrate from legacy temp-battle checkout if present
              if [ -d "$HOME/temp-battle/.git" ]; then
                mv "$HOME/temp-battle" "$APP_DIR"
                git -C "$APP_DIR" remote set-url origin https://github.com/fireweave-HQ-Demo/arcade.git
              else
                git clone --depth=1 --branch "$BRANCH" https://github.com/fireweave-HQ-Demo/arcade.git "$APP_DIR"
              fi
            fi
            cd "$APP_DIR"
            git remote set-url origin https://github.com/fireweave-HQ-Demo/arcade.git
            # Explicit refspec so shallow clones create origin/<branch> (needed when switching main ↔ fw-base).
            git fetch --depth=1 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout -B "$BRANCH" "origin/${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            echo "deploying branch=$BRANCH sha=$(git rev-parse --short HEAD)"
            echo "$BRANCH" > .deploy-branch
            chmod +x scripts/deploy-prod.sh scripts/prod-start.sh scripts/prod-stop.sh scripts/dev.sh scripts/dev-stop.sh
            ./scripts/deploy-prod.sh
